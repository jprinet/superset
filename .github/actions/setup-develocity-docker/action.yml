name: "Setup Develocity for Docker"
description: "Starts the Develocity Docker agent so that image builds publish Build Scans to develocity.apache.org, using DEVELOCITY_ACCESS_KEY from the job environment"
runs:
  using: "composite"
  steps:
    - name: Setup Develocity for Docker
      uses: gradle/develocity-actions/setup-docker@9d8792ab22712b19790c2abce53e9ebb2694c312 # v2.5
      with:
        develocity-url: https://develocity.apache.org
        develocity-access-key: ${{ env.DEVELOCITY_ACCESS_KEY }}
        develocity-package-scan-enabled: false
