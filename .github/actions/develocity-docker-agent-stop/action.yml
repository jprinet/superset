name: "Stop Develocity Docker agent"
description: "Stops the Develocity Docker agent, letting it finish publishing the current Build Scan, and prints its log"
runs:
  using: "composite"
  steps:
    - name: Stop Develocity Docker agent
      shell: bash
      run: |
        pid_file="$RUNNER_TEMP/develocity-docker-agent.pid"
        if [ -f "$pid_file" ]; then
          pid="$(cat "$pid_file")"
          kill -TERM "$pid" 2> /dev/null || true
          for _ in $(seq 1 40); do
            kill -0 "$pid" 2> /dev/null || break
            sleep 1
          done
        fi
        cat "$RUNNER_TEMP/develocity-docker-agent.log" 2> /dev/null || true
