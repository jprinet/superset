name: "Start Develocity Docker agent"
description: "Starts the Develocity Docker agent in the background so that Docker image builds publish Build Scans to develocity.apache.org"
runs:
  using: "composite"
  steps:
    - name: Set up Java for the Develocity Docker agent
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: "temurin"
        java-version: "21"

    - name: Start Develocity Docker agent
      shell: bash
      env:
        DEVELOCITY_URL: https://develocity.apache.org
        AGENT_VERSION: 0.9.0
        AGENT_SHA256: 16943826bc7a03d76104e962e02d72880391e06b0fcd5bff43e76ba51b9d5ec3
      run: |
        jar="$RUNNER_TEMP/develocity-docker-agent.jar"
        log="$RUNNER_TEMP/develocity-docker-agent.log"
        if ! curl -fsSL --retry 3 -o "$jar" \
            "https://develocity-docker-build-agent.gradle.com/develocity-docker-agent-${AGENT_VERSION}.jar" ||
          ! echo "${AGENT_SHA256}  ${jar}" | sha256sum -c --quiet -; then
          echo "::warning::Could not download the Develocity Docker agent; Build Scans will not be published"
          exit 0
        fi
        nohup java -jar "$jar" > "$log" 2>&1 &
        pid=$!
        echo "$pid" > "$RUNNER_TEMP/develocity-docker-agent.pid"
        for _ in $(seq 1 60); do
          if grep -q "subscribed to BuildKit" "$log"; then
            echo "Develocity Docker agent is ready"
            exit 0
          fi
          kill -0 "$pid" 2> /dev/null || break
          sleep 1
        done
        echo "::warning::The Develocity Docker agent did not start; Build Scans will not be published"
        cat "$log"
